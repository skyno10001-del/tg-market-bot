name: Telegram Market Bot (KST)

on:
  workflow_dispatch:
    inputs:
      job:
        description: "overseas | premarket | midday | close"
        required: true
        default: "overseas"
      mode:
        description: "draft | publish"
        required: true
        default: "draft"

  schedule:
    - cron: "30 23 * * 0-4"
    - cron: "10 0 * * 1-5"
    - cron: "30 2 * * 1-5"
    - cron: "20 6 * * 1-5"

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - run: npm ci

      - name: Run bot
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_ADMIN_CHAT_ID: ${{ secrets.TG_ADMIN_CHAT_ID }}
          TG_CHANNEL_CHAT_ID: ${{ secrets.TG_CHANNEL_CHAT_ID }}
          MODE: ${{ github.event.inputs.mode || 'draft' }}
          JOB: ${{ github.event.inputs.job || 'overseas' }}
        run: npm start