name: Telegram Market Bot (KST)

on:
  schedule:
    - cron: "30 23 * * 0-4"  # 08:30 KST (Mon-Fri)
    - cron: "10 0 * * 1-5"   # 09:10 KST (Mon-Fri)
  workflow_dispatch:
    inputs:
      job:
        description: "overseas | news"
        required: true
        default: "overseas"
        type: choice
        options:
          - overseas
          - news

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci

      - name: Set JOB
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "JOB=${{ github.event.inputs.job }}" >> $GITHUB_ENV
          else
            if [ "${{ github.event.schedule }}" = "30 23 * * 0-4" ]; then
              echo "JOB=overseas" >> $GITHUB_ENV
            elif [ "${{ github.event.schedule }}" = "10 0 * * 1-5" ]; then
              echo "JOB=news" >> $GITHUB_ENV
            else
              echo "JOB=overseas" >> $GITHUB_ENV
            fi
          fi

      - name: Run bot (publish to main channel)
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_ADMIN_CHAT_ID: ${{ secrets.TG_ADMIN_CHAT_ID }}
          TG_CHANNEL_CHAT_ID: ${{ secrets.TG_CHANNEL_CHAT_ID }}
          MODE: publish
          JOB: ${{ env.JOB }}
          CAT_REALTIME: "@flow_realtime"
          CAT_THEME: "@flow_theme"
          CAT_WATCH: "@flow_watch"
          CAT_SUPPLY: "@flow_supply"
          CAT_CALENDAR: "@flow_calendar"
          CAT_SHARE: "@flow_share"
        run: npm start